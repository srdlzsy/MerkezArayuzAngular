<div class="admin-layout" [class.is-sidebar-collapsed]="isSidebarRailMode()">
  <aside
    class="app-sidebar"
    [class.app-sidebar-open]="isSidebarOpen()"
    [class.app-sidebar-collapsed]="isSidebarRailMode()"
  >
    <ng-container *ngTemplateOutlet="sidebarContent"></ng-container>
  </aside>

  <button
    type="button"
    class="sidebar-backdrop"
    *ngIf="isSidebarOpen()"
    (click)="closeSidebar()"
    aria-label="Menuyu kapat"
  ></button>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-leading">
        <button type="button" class="menu-trigger" (click)="toggleSidebar()" aria-label="Menuyu ac">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <a class="home-link" routerLink="/dashboard" aria-label="Anasayfa">
          <img src="assets/furpa-600.png" alt="Furpa" />
        </a>
        <strong class="page-title">{{ pageTitle() }}</strong>
      </div>

      <div class="topbar-user">
        <ng-container *ngTemplateOutlet="announcementMenu"></ng-container>
        <span class="topbar-divider"></span>
        <span class="topbar-branch">{{ branchLabel() }}</span>
        <button type="button" class="logout-button" (click)="logout()">Cikis</button>
      </div>
    </header>

    <header class="topbar-mobile">
      <div class="topbar-mobile-main">
        <button type="button" class="menu-trigger mobile-trigger" (click)="toggleSidebar()" aria-label="Menuyu ac">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <a class="home-link mobile-home-link" routerLink="/dashboard" aria-label="Anasayfa">
          <img src="assets/furpa-600.png" alt="Furpa" />
        </a>
      </div>

      <div class="topbar-mobile-meta">
        <strong class="page-title mobile-page-title">{{ pageTitle() }}</strong>

        <div class="mobile-user">
          <ng-container *ngTemplateOutlet="announcementMenu"></ng-container>
          <span class="topbar-branch mobile-branch">{{ branchLabel() }}</span>
          <button type="button" class="logout-button mobile-logout" (click)="logout()">Cikis</button>
        </div>
      </div>
    </header>

    <section class="content-wrapper" #contentWrapper>
      <router-outlet></router-outlet>
    </section>
  </main>
</div>

<ng-template #announcementMenu>
  <div class="announcement-wrap">
    <button
      type="button"
      class="announcement-button"
      title="Duyurular"
      aria-label="Duyurular"
      (click)="toggleAnnouncementInbox()"
    >
      <i class="fa-solid fa-bell"></i>
      <span class="announcement-badge" *ngIf="unreadAnnouncementCount()">
        {{ formatAnnouncementCount(unreadAnnouncementCount()) }}
      </span>
    </button>

    <section class="announcement-panel" *ngIf="announcementInboxOpen()">
      <header class="announcement-panel-head">
        <div>
          <span>Duyurular</span>
          <strong>{{ unreadAnnouncementCount() }} okunmamis</strong>
        </div>
        <button type="button" class="announcement-refresh" (click)="loadAnnouncementInbox()" [disabled]="announcementsLoading()">
          <i class="fa-solid" [ngClass]="announcementsLoading() ? 'fa-circle-notch fa-spin' : 'fa-rotate'"></i>
        </button>
      </header>

      <article class="announcement-state" *ngIf="announcementsLoading()">
        Duyurular yukleniyor.
      </article>

      <button
        type="button"
        class="announcement-item"
        *ngFor="let item of announcementItems(); trackBy: trackAnnouncement"
        [ngClass]="getAnnouncementPriorityClass(item.priority)"
        (click)="markAnnouncementAsRead(item, $event)"
      >
        <span>{{ item.priorityName || item.priority }}</span>
        <strong>{{ item.title }}</strong>
        <small>{{ item.message }}</small>
        <em>{{ formatAnnouncementDate(item.publishedAtUtc) }}</em>
      </button>

      <article class="announcement-state" *ngIf="!announcementsLoading() && announcementsMessage()">
        {{ announcementsMessage() }}
      </article>

      <button
        type="button"
        class="announcement-management"
        *ngIf="canOpenAnnouncementManagement()"
        (click)="openAnnouncementManagement()"
      >
        Tumunu Goster
      </button>
    </section>
  </div>
</ng-template>
<ng-template #sidebarContent>
  <div class="sidebar-header">
    <button
      type="button"
      class="sidebar-close"
      (click)="closeSidebar()"
      aria-label="Menuyu kapat"
    >
      x
    </button>
    <h2>FURPA ONLINE<br />SISTEM</h2>
    <button
      type="button"
      class="sidebar-collapse-button"
      (click)="toggleSidebarCollapsed()"
      [attr.aria-label]="isSidebarCollapsed() ? 'Menuyu genislet' : 'Menuyu daralt'"
      [attr.title]="isSidebarCollapsed() ? 'Menuyu genislet' : 'Menuyu daralt'"
    >
      <i class="fas" [ngClass]="isSidebarCollapsed() ? 'fa-angles-right' : 'fa-angles-left'"></i>
      <span>{{ isSidebarCollapsed() ? 'Genislet' : 'Daralt' }}</span>
    </button>
  </div>

  <div class="branch-card">
    <span>{{ branchLabel() }}</span>
  </div>

  <div class="menu-label">MENU</div>

  <nav class="sidebar-nav">
    <section
      class="menu-group"
      *ngFor="let group of menuGroups(); let groupIndex = index"
      [class.menu-group-active]="isGroupActive(group)"
      [class.menu-group-open]="isRailGroupOpen(group.id)"
    >
      <button
        type="button"
        class="menu-group-toggle"
        (click)="toggleSection(group.id, $event)"
        [attr.aria-expanded]="isSidebarRailMode() ? isRailGroupOpen(group.id) : isSectionOpen(group.id)"
        [attr.title]="group.label"
        [attr.aria-label]="group.label"
      >
        <span class="group-label">
          <i [class]="getGroupIcon(group, groupIndex)"></i>
          <span>{{ group.label }}</span>
        </span>
        <span class="chevron">{{ isSectionOpen(group.id) ? '-' : '+' }}</span>
      </button>

      <div
        class="menu-tree"
        *ngIf="isSidebarRailMode() ? isRailGroupOpen(group.id) : isSectionOpen(group.id)"
        [style.top]="isSidebarRailMode() ? getRailMenuTopPx() : null"
      >
        <strong class="menu-flyout-title">{{ group.label }}</strong>
        <a
          *ngFor="let item of group.children"
          class="menu-link"
          [routerLink]="item.route"
          routerLinkActive="menu-link-active"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.title]="item.label"
          (click)="handleLeafNavigate()"
        >
          {{ item.label }}
        </a>
      </div>
    </section>
  </nav>
</ng-template>
