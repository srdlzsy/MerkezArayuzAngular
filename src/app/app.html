@if (authService.isHydratingSession()) {
  <main class="session-startup" role="status" aria-live="polite" aria-label="Oturum dogrulaniyor">
    <div class="session-startup-content">
      <img src="assets/furpa-login.png" alt="Furpa Online" />
      <div class="session-startup-copy">
        <strong>Oturum dogrulaniyor</strong>
        <span>Sube ve yetki bilgileriniz hazirlaniyor.</span>
      </div>
      <span class="session-startup-progress" aria-hidden="true"></span>
    </div>
  </main>
}

<router-outlet />
<app-confirm-dialog />

@if (appUpdateService.updateAvailable()) {
  <aside class="app-update-notice" role="status" aria-live="polite">
    <div>
      <strong>Yeni surum hazir</strong>
      <span>Guncel ekrana gecmek icin yenileyin.</span>
    </div>
    <button type="button" (click)="appUpdateService.reload()">Guncelle</button>
  </aside>
}
